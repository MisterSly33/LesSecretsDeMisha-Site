<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grimoire de Misha — Administration</title>
<style>body{margin:0;background:#f6f0e2;color:#183c2d;font-family:Georgia,serif}header{background:#183c2d;color:white;text-align:center;padding:20px}main{max-width:750px;margin:25px auto;padding:15px}section{background:#fffdf7;padding:24px;border-radius:15px;margin-bottom:18px}label{display:block;margin-top:13px}input,textarea,select{box-sizing:border-box;width:100%;padding:11px;margin-top:5px}textarea{min-height:125px}button{background:#245b40;color:white;border:0;padding:11px;border-radius:8px;margin:10px 8px 0 0;cursor:pointer}button:disabled{opacity:.5}.hidden{display:none}.item{border-top:1px solid #ddd;padding:12px 0}#message{white-space:pre-wrap}.tabs{display:flex;gap:12px}.tabs button{flex:1}.tabs .active{background:#173827}</style></head>
<body><header><h1>🌿 Le Grimoire de Misha</h1><p>Administration des astuces et de l'agenda</p></header><main>
<section id="login"><h2>Connexion de Magali</h2><form id="loginForm"><label>Adresse e-mail</label><input id="email" type="email" required><label>Mot de passe</label><input id="password" type="password" required><button>Se connecter</button></form></section>
<div id="app" class="hidden"><section><p id="user"></p><button id="logout">Se déconnecter</button></section><section class="tabs"><button id="showTips" class="active">🌿 Astuces</button><button id="showAgenda">📅 Agenda</button></section>
<div id="tipsPanel"><section><h2 id="formTitle">Nouvelle astuce</h2><form id="tipForm"><label>Titre</label><input id="titre" required><label>Contenu</label><textarea id="contenu" required></textarea><label>Adresse de la photo</label><input id="photo" type="url"><label>Catégorie</label><input id="categorie"><label>Saison</label><input id="saison"><label>Statut</label><select id="statut"><option value="brouillon">Brouillon</option><option value="publiée">Publiée</option><option value="archivée">Archivée</option></select><button>Enregistrer</button><button type="button" id="cancel">Nouvelle astuce</button></form></section><section><h2>Mes astuces</h2><div id="liste"></div></section></div>
<div id="agendaPanel" class="hidden"><section><h2 id="agendaTitle">Nouvel événement</h2><form id="agendaForm"><label>Titre</label><input id="a_titre" required><label>Catégorie</label><input id="a_categorie" placeholder="Marché, atelier, salon…"><label>Début</label><input id="a_date_debut" type="datetime-local" required><label>Fin (facultative)</label><input id="a_date_fin" type="datetime-local"><label>Lieu</label><input id="a_lieu"><label>Adresse</label><input id="a_adresse"><label>Description</label><textarea id="a_description"></textarea><label>Lien externe</label><input id="a_lien" type="url"><label>Statut</label><select id="a_statut"><option value="brouillon">Brouillon</option><option value="publie">Publié</option><option value="archive">Archivé</option></select><button>Enregistrer l'événement</button><button type="button" id="agendaCancel">Nouvel événement</button></form></section><section><h2>Mes événements</h2><div id="agendaListe"></div></section></div></div><section id="message" class="hidden" role="status"></section></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://fnxawannqbemythnavmd.supabase.co','sb_publishable_UZrk3AxoTubdsq6-Mlsseg_809Bf5QR');
const ADMIN='616506dc-c6af-4def-b14b-dba83af1fa9a',el=id=>document.getElementById(id);
let editing=null,editingEvent=null;
function message(t){el('message').textContent=t;el('message').classList.remove('hidden')}
function clearMessage(){el('message').classList.add('hidden');el('message').textContent=''}
function reset(){editing=null;el('tipForm').reset();el('formTitle').textContent='Nouvelle astuce'}
function resetEvent(){editingEvent=null;el('agendaForm').reset();el('agendaTitle').textContent='Nouvel événement'}
function tab(which){const tips=which==='tips';el('tipsPanel').classList.toggle('hidden',!tips);el('agendaPanel').classList.toggle('hidden',tips);el('showTips').classList.toggle('active',tips);el('showAgenda').classList.toggle('active',!tips);clearMessage()}
el('showTips').onclick=()=>tab('tips');el('showAgenda').onclick=()=>tab('agenda');
async function check(){const {data:{user}}=await db.auth.getUser(),allowed=user?.id===ADMIN;el('login').classList.toggle('hidden',allowed);el('app').classList.toggle('hidden',!allowed);if(user&&!allowed){await db.auth.signOut();message('Accès non autorisé.')}if(allowed){el('user').textContent=user.email;await Promise.all([load(),loadEvents()])}}
el('loginForm').onsubmit=async e=>{e.preventDefault();clearMessage();const {error}=await db.auth.signInWithPassword({email:el('email').value,password:el('password').value});if(error)message(error.message);else{el('password').value='';await check()}};
el('logout').onclick=async()=>{await db.auth.signOut();clearMessage();await check()};el('cancel').onclick=reset;el('agendaCancel').onclick=resetEvent;
async function load(){const {data,error}=await db.from('astuces').select('id,titre,contenu,photo,categorie,saison,statut').order('id',{ascending:false});if(error){message('Astuces : '+error.message);return}el('liste').replaceChildren();for(const tip of data){const div=document.createElement('div');div.className='item';const title=document.createElement('strong');title.textContent=tip.titre;const info=document.createElement('p');info.textContent=tip.statut;const button=document.createElement('button');button.textContent='Modifier';button.onclick=()=>{editing=tip.id;for(const key of ['titre','contenu','photo','categorie','saison'])el(key).value=tip[key]||'';el('statut').value=tip.statut;el('formTitle').textContent='Modifier une astuce';el('formTitle').scrollIntoView({behavior:'smooth'})};div.append(title,info,button);el('liste').append(div)}}
el('tipForm').onsubmit=async e=>{e.preventDefault();const payload={};for(const key of ['titre','contenu','photo','categorie','saison','statut'])payload[key]=el(key).value;const {error}=editing===null?await db.from('astuces').insert(payload):await db.from('astuces').update(payload).eq('id',editing);if(error){message(error.message);return}reset();await load();message('Astuce enregistrée !')};
function inputDate(iso){if(!iso)return '';const d=new Date(iso),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function iso(id){return el(id).value?new Date(el(id).value).toISOString():null}
async function loadEvents(){const {data,error}=await db.from('Agenda').select('id,titre,categorie,date_debut,date_fin,lieu,adresse,description,lien,statut').order('date_debut',{ascending:true});if(error){message('Agenda : '+error.message);return}el('agendaListe').replaceChildren();if(!data.length)el('agendaListe').textContent='Aucun événement pour le moment.';for(const event of data){const div=document.createElement('div');div.className='item';const title=document.createElement('strong');title.textContent=event.titre;const info=document.createElement('p');info.textContent=`${event.date_debut?new Date(event.date_debut).toLocaleString('fr-FR'):'Date non définie'} — ${event.lieu||'Lieu à préciser'} — ${event.statut}`;const button=document.createElement('button');button.textContent='Modifier';button.onclick=()=>{editingEvent=event.id;for(const key of ['titre','categorie','lieu','adresse','description','lien'])el('a_'+key).value=event[key]||'';el('a_date_debut').value=inputDate(event.date_debut);el('a_date_fin').value=inputDate(event.date_fin);el('a_statut').value=event.statut||'brouillon';el('agendaTitle').textContent='Modifier un événement';el('agendaTitle').scrollIntoView({behavior:'smooth'})};div.append(title,info,button);el('agendaListe').append(div)}}
el('agendaForm').onsubmit=async e=>{e.preventDefault();clearMessage();const start=iso('a_date_debut'),end=iso('a_date_fin');if(end&&end<start){message('La fin doit être postérieure au début.');return}const payload={date_debut:start,date_fin:end};for(const key of ['titre','categorie','lieu','adresse','description','lien','statut'])payload[key]=el('a_'+key).value;const btn=e.submitter;btn.disabled=true;try{const {error}=editingEvent===null?await db.from('Agenda').insert(payload):await db.from('Agenda').update(payload).eq('id',editingEvent);if(error){message('Agenda : '+error.message);return}resetEvent();await loadEvents();message('Événement enregistré !')}finally{btn.disabled=false}};
await check();
</script></body></html>
